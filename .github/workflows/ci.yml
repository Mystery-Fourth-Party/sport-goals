name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Profondeur 2 : sur une PR, le commit extrait est la fusion de la PR
      # dans la base, et son premier parent (HEAD^1) est le sommet de la base.
      # C'est ce que l'étape `changes` compare, sans historique complet.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Version lue dans .nvmrc et non écrite ici : une seule source, que
      # `nvm use` / `fnm use` lisent aussi sur le poste de dev, et qui rend
      # toute montée de majeure visible dans un diff. `lts/*` suivait la LTS
      # du jour, donc la CI changeait de Node sans qu'aucun commit ne le
      # dise — alors que les quatre passages de fuseaux plus bas reposent sur
      # le comportement de Node face aux dates.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - id: install
        run: npm ci

      # `npm ci` réinstalle le lock à l'identique : un paquet figé sous ce
      # que sa propre plage `~57.0.x` autorise y reste indéfiniment sans que
      # rien ne le signale. C'est ainsi que 12 paquets avaient dérivé, dont
      # expo, expo-router et expo-notifications. La vérification de dérive
      # sort en erreur dès qu'un paquet du SDK décroche, pour que la dérive
      # soit un échec daté plutôt qu'un constat fait des mois après.
      #
      # Elle ne tourne ici que si le changement touche package.json ou
      # package-lock.json : une publication d'Expo ne dit rien du code d'une
      # PR sans rapport avec les dépendances, et la rendait rouge. Le reste du
      # temps, la dérive est signalée chaque semaine par expo-drift.yml. Le
      # fichier est lu dans la fusion de la PR avec sa base, ou, sur un push,
      # entre l'état d'avant et celui d'après. Un état d'avant introuvable
      # (premier push d'une branche, historique réécrit) compte comme un
      # changement : mieux vaut un contrôle de trop qu'un oubli.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          deps=true
          if [ "$EVENT" = pull_request ]; then
            base=HEAD^1
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            files=$(git diff --name-only "$base" HEAD)
            if printf '%s\n' "$files" | grep -qxE 'package(-lock)?\.json'; then
              deps=true
            else
              deps=false
            fi
          fi
          echo "deps=$deps" >> "$GITHUB_OUTPUT"

      - if: ${{ steps.install.outcome == 'success' && steps.changes.outputs.deps == 'true' }}
        run: npx expo install --check

      # Toutes les étapes suivantes tournent même si la vérification de
      # dérive échoue : une publication d'Expo ne dit rien du code de la PR,
      # et sans ces conditions elle masquerait typecheck, lint et tests.
      # Aucune ne lit l'issue de la vérification, donc qu'elle soit ignorée
      # ne change rien pour elles.
      # Elles restent suspendues à ce dont elles dépendent vraiment : rien
      # ne tourne sans `npm ci`, et typecheck exige que `expo customize`
      # ait réussi — sans les types générés, il vérifierait un programme
      # plus faible et pourrait sortir vert à tort (voir ci-dessous).
      #
      # `tsconfig.json` inclut `.expo/types/**/*.ts` et `expo-env.d.ts`, que
      # `.gitignore` exclut : en CI ces deux fichiers n'existaient donc pas,
      # et `tsc --noEmit` y typecheckait un programme plus faible que celui
      # du poste de dev. Mesuré en remplaçant `router.push('/weekly')` par
      # `'/weeekly'` dans app/index.tsx : TS2345 en local, aucune sortie et
      # exit 0 sans les fichiers générés.
      #
      # `expo customize tsconfig.json` les régénère tous les deux sans
      # démarrer Metro — il appelle startTypescriptTypeGenerationAsync avec
      # `metro`/`server` à undefined. Environ 2,5 s, `.expo/` présent ou non.
      - id: customize
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx expo customize tsconfig.json

      # La commande a le droit de réécrire tsconfig.json et .gitignore (elle
      # y ajoute ses propres entrées si elles manquent) ; sur l'état actuel
      # elle les laisse identiques à l'octet près. Le jour où ça change, on
      # veut le voir ici et non dans le diff d'une PR sans rapport.
      - if: ${{ !cancelled() && steps.customize.outcome == 'success' }}
        run: git diff --exit-code tsconfig.json .gitignore

      - if: ${{ !cancelled() && steps.customize.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      # Quatre fuseaux, quatre passages de tests. Seuls les tests en dépendent :
      # typecheck/lint/format:check sont insensibles au fuseau, donc une
      # matrice sur tout le job aurait quadruplé l'installation et ces trois
      # étapes pour ne rien couvrir de plus.
      #
      # Le choix des quatre : UTC et Asia/Tokyo ne changent jamais d'heure
      # (Tokyo, en plus, est à l'est d'UTC), America/New_York et Europe/Paris
      # changent d'heure à des dates différentes (deuxième dimanche de mars et
      # premier dimanche de novembre, contre dernier dimanche de mars et
      # d'octobre) — un calcul de dates qui traverse l'un des deux
      # changements d'heure ne traverse pas forcément l'autre —, et Paris est
      # le fuseau réel d'usage de l'application.
      #
      # Suite complète à chaque fois, et pas seulement src/stats.timezone.test.ts :
      # les régressions de fuseau trouvées en préparant ce commit étaient dans
      # stats.test.ts et goals-context.test.tsx, qu'un passage ciblé aurait
      # laissées filer.
      #
      # TZ posé explicitement même pour UTC : les runners GitHub y sont déjà,
      # mais l'écrire fait des quatre fuseaux un contrat du dépôt plutôt qu'un
      # effet de bord de la machine d'exécution.
      - name: tests (TZ=UTC)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test
        env:
          TZ: UTC

      # npx jest et non npm run test : les seuils de couverture sont déjà
      # vérifiés par le passage UTC ci-dessus, les recalculer deux fois ne
      # dirait rien de plus.
      #
      # !cancelled() : sans lui, le job s'arrête au premier fuseau en échec et
      # les suivants ne tournent jamais, un fuseau cassé masquant le suivant.
      # Les quatre passages doivent pouvoir être comparés en une fois, sinon
      # chaque fuseau cassé coûte un aller-retour.
      - name: tests (TZ=America/New_York)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx jest
        env:
          TZ: America/New_York

      - name: tests (TZ=Asia/Tokyo)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx jest
        env:
          TZ: Asia/Tokyo

      - name: tests (TZ=Europe/Paris)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx jest
        env:
          TZ: Europe/Paris
